name: CI / Deploy

on:
  push:
    branches:
      - main

jobs:
  ci:
    name: Lint + Testes
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Setup Node.js 22
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '22'
          cache: 'yarn'

      - name: Instalar dependências
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Testes unitários
        run: yarn test --passWithNoTests --forceExit
        env:
          NODE_ENV: test

  audit:
    name: Auditoria de dependências
    uses: ./.github/workflows/audit.yml

  deploy:
    name: Deploy VPS
    runs-on: ubuntu-latest
    needs: [ci, audit]

    steps:
      - name: Diagnóstico SSH (DNS + porta)
        run: |
          echo "Host: ${{ secrets.VPS_HOST }}"
          getent hosts "${{ secrets.VPS_HOST }}" || true
          nc -zvw5 "${{ secrets.VPS_HOST }}" "${{ secrets.VPS_PORT || 22 }}"

      - name: Deploy via SSH
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_SSH_FINGERPRINT }}
          port: ${{ secrets.VPS_PORT || 22 }}
          timeout: 2m
          command_timeout: 20m
          script: |
            set -euo pipefail

            COMPOSE="docker compose -f /opt/inexci/docker-compose.prod.yml"

            echo "==> Atualizando código..."
            cd /opt/inexci/inexci-api && git pull && cd /opt/inexci

            echo "==> Reconstruindo imagens da API e do stt-service..."
            $COMPOSE build api stt-service

            echo "==> Pré-flight de migrations (somente leitura)..."
            $COMPOSE run --rm --no-deps api npm run migration:preflight

            echo "==> Aplicando migrations..."
            $COMPOSE run --rm --no-deps api npm run typeorm:migration:run

            echo "==> Subindo redis, stt-service, api, docker-socket-proxy e alloy..."
            if ! $COMPOSE up -d redis stt-service api docker-socket-proxy alloy; then
              echo "==> Aviso: docker compose reportou erro ao subir serviços. Vou coletar diagnósticos da API..."
            fi

            echo "==> Aguardando API ficar healthy..."
            HEALTHY=false
            for i in $(seq 1 36); do
              STATUS=$(docker inspect --format='{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' inexci-api 2>/dev/null || echo "not-found")
              if [ "$STATUS" = "healthy" ]; then
                echo "==> API healthy!"
                HEALTHY=true
                break
              fi
              echo "    status atual: $STATUS ($i/36)"
              sleep 10
            done

            if [ "$HEALTHY" = "false" ]; then
              echo "==> ERRO: API não ficou healthy em 6 minutos."
              echo "==> Últimos logs da API:"
              $COMPOSE logs api --tail 200
              echo "==> Inspeção do healthcheck do container:"
              docker inspect --format='{{json .State.Health}}' inexci-api || true
              exit 1
            fi

            echo "==> Subindo nginx (recriado para reresolver o IP da api)..."
            $COMPOSE up -d --force-recreate nginx

            echo "==> Status final:"
            $COMPOSE ps
